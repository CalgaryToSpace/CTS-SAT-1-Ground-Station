# Per-IP request rate limit (basic DoS protection).
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80;
    server_name frontiersat.mooo.com; # <-- replace with your domain

    # Let's Encrypt HTTP-01 challenge (used by the certbot service).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name frontiersat.mooo.com; # <-- replace with your domain

    ssl_certificate     /etc/letsencrypt/live/frontiersat.mooo.com/fullchain.pem; # <-- replace
    ssl_certificate_key /etc/letsencrypt/live/frontiersat.mooo.com/privkey.pem; # <-- replace

    location / {
        limit_req zone=perip burst=20 nodelay;
        # Re-resolve "web" via Docker's embedded DNS on every request
        # (a plain `proxy_pass http://web:8089;` caches the IP at nginx
        # startup, so it goes stale -- 502 -- once `web` is recreated by a
        # redeploy) instead of once at startup.
        resolver 127.0.0.11 valid=10s;
        set $web_upstream web:8089;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
