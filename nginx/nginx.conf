# Raw exports served straight off disk get a looser limit, as DuckDB reads them
# with many small range requests. Whole-table URLs of month-partitioned tables
# are excluded: each request (even HEAD) merges every month into a temp file.
# Matched on the undecoded $request_uri, so encoded or `..` paths stay strict.
map $request_uri $file_export_key {
    default '';
    "~^/raw-export/(?!(raw_packets|distinct_packets_over_time|everything_decoded)\.parquet)\w+(/([0-9]{4}-[0-9]{2}|none))?\.parquet(\?|$)" $binary_remote_addr;
}

# An empty key isn't counted, so each request falls in exactly one zone.
map $file_export_key $general_key {
    default '';
    ''      $binary_remote_addr;
}

# Per-IP request rate limits (basic DoS protection).
# A zone's key can't change on reload: rename the zone if you change its key.
limit_req_zone $general_key zone=perip_general:10m rate=10r/s;
limit_req_zone $file_export_key zone=perip_files:10m rate=100r/s;

# "Connection: upgrade" for websocket handshakes, "close" for everything
# else (the standard nginx websocket-proxy idiom; see the `location /`
# below for why it matters).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name frontiersat.mooo.com; # <-- replace with your domain

    # Let's Encrypt HTTP-01 challenge (used by the certbot service).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name frontiersat.mooo.com; # <-- replace with your domain

    ssl_certificate     /etc/letsencrypt/live/frontiersat.mooo.com/fullchain.pem; # <-- replace
    ssl_certificate_key /etc/letsencrypt/live/frontiersat.mooo.com/privkey.pem; # <-- replace

    location / {
        # burst sized for page loads that fire ~50 image/asset requests at once.
        limit_req zone=perip_general burst=100 nodelay;
        limit_req zone=perip_files burst=500 nodelay;
        # Reject over-limit requests with 429 Too Many Requests rather than
        # nginx's default 503, so rate limiting is distinguishable from the
        # backend actually being down (in the logs and in the browser).
        limit_req_status 429;
        # Re-resolve "web" via Docker's embedded DNS on every request
        # (a plain `proxy_pass http://web:8089;` caches the IP at nginx
        # startup, so it goes stale -- 502 -- once `web` is recreated by a
        # redeploy) instead of once at startup.
        resolver 127.0.0.11 valid=10s;
        set $web_upstream web:8089;
        proxy_pass http://$web_upstream;

        # Let the dashboard's websocket through. NiceGUI talks to the
        # browser over socket.io; without these headers the websocket
        # upgrade fails and socket.io falls back to HTTP long-polling, where
        # every UI update is its own request. Those count against the
        # `limit_req` above, so busy pages (e.g. attitude playback) get
        # 503s. An upgraded websocket is a single request, however many
        # messages it carries.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
